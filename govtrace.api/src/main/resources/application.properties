spring.application.name=govtrace.api

# =====================================================
# 1. BANCO DE DADOS (MySQL no Docker/Local porta 3307)
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3307/govtrace_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=En648213!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# 2. JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================
# 3. VIRTUAL THREADS (Project Loom - Java 21)
# Processa auditorias em paralelo sem travar RAM
# =====================================================
spring.threads.virtual.enabled=true

# =====================================================
# 4. GROQ (Provedor principal de IA ? sem consumo de RAM local)
#    Compatible com API OpenAI via LangChain4j open-ai starter.
#
#    IMPORTANTE: nunca commite a chave real aqui.
#    Use variável de ambiente: export GROQ_API_KEY=gsk_...
#    No IntelliJ: Run > Edit Configurations > Environment Variables
# =====================================================
langchain4j.open-ai.chat-model.base-url=https://api.groq.com/openai/v1
langchain4j.open-ai.chat-model.api-key=
langchain4j.open-ai.chat-model.model-name=llama-3.3-70b-versatile
langchain4j.open-ai.chat-model.temperature=0.1
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true
langchain4j.open-ai.chat-model.max-tokens=2048

# Desliga os autoconfigures do LangChain4j que criam beans extras conflitantes.
# O AiConfig.java cria o groqChatModel manualmente ? não precisamos dos automáticos.

langchain4j.open-ai.chat-model.enabled=false
langchain4j.ollama.chat-model.enabled=false
# =====================================================
# 5. OLLAMA (Provedor alternativo ? inferência local)
#    Ative quando quiser rodar sem internet.
#    Requer: ollama serve + ollama pull llama3.2
#
#    Para usar Ollama em vez de Groq, troque o @Bean
#    ativo em AiConfig.java (comentário dentro do arquivo).
# =====================================================
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=llama3.2
langchain4j.ollama.chat-model.temperature=0.1
langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true

# =====================================================
# 6. INTEGRAÇÕES EXTERNAS
# =====================================================
logging.level.tfs.com.govtrace.api.controllers.PortalTransparenciaClient=DEBUG
govtrace.mcp.url=http://localhost:8000/mcp
govtrace.mcp.base-url=http://localhost:3000
springdoc.swagger-ui.path=/swagger-ui.html
# Ordenar os endpoints por método HTTP
springdoc.swagger-ui.operationsSorter=method
# Habilitar o modo de visualização de pacotes específicos se necessário
springdoc.packages-to-scan=tfs.com.govtrace.api.controllers
# Configurações do Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=govtrace-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer