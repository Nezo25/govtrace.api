spring.application.name=govtrace.api

# Carrega .env da raiz do m?dulo (govtrace.api/) ? Twelve-Factor App, fator III
spring.config.import=optional:file:.env[.properties]

# Conex?o MySQL (credenciais via ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/govtrace_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=false
spring.kafka.listener.concurrency=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.threads.virtual.enabled=true

# IA ? Groq (chave via GROQ_API_KEY no .env)
langchain4j.open-ai.chat-model.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
langchain4j.open-ai.chat-model.api-key=${GROQ_API_KEY}
langchain4j.open-ai.chat-model.model-name=${GROQ_MODEL_NAME:llama-3.1-8b-instant}
langchain4j.open-ai.chat-model.temperature=0.1
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true
langchain4j.open-ai.chat-model.max-tokens=2048
langchain4j.open-ai.chat-model.enabled=true

langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=llama3.2
langchain4j.ollama.chat-model.temperature=0.1
langchain4j.ollama.chat-model.enabled=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=govtrace-carga-v3
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Integra??o MCP
govtrace.mcp.url=${GOVTRACE_MCP_URL:http://localhost:8000/mcp}
govtrace.mcp.base-url=http://localhost:3000
govtrace.ia.provider=groq

govtrace.auditoria.lote-maximo=1200
govtrace.emendas.limite-carga=1200
# MUNICIPIO = varre a API inteira e retorna só Bragança Paulista (recomendado para o TCC)
govtrace.emendas.escopo=MUNICIPIO
govtrace.emendas.uf=SP
govtrace.emendas.codigo-ibge=3507605
govtrace.emendas.municipio-padrao=braganca-paulista
govtrace.emendas.priorizar-municipio=true
# ~377 páginas/ano na API federal; 450 garante varredura completa
govtrace.emendas.max-paginas-busca=450
govtrace.mcp.connect-timeout-ms=15000
govtrace.mcp.read-timeout-ms=1800000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

logging.level.tfs.com.govtrace.api=INFO
logging.level.org.springframework.kafka=ERROR
